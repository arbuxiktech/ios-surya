name: metal

on:
  workflow_dispatch:
  push:
    branches: [main, codex/surya-port]
    paths:
      - "graphics/metal/**"
      - "graphics/native/**"
      - "tools/build_metal_userspace.py"
      - ".github/workflows/metal.yml"

concurrency:
  group: metal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$XC" ]; then
            XC="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        run: |
          brew install meson ninja glslang bison llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          pip3 install --break-system-packages mako pyyaml || pip3 install mako pyyaml
          rustup target add aarch64-apple-ios

      - name: Build Metal Userspace (Turnip + Bridge + Bundle)
        run: |
          python3 tools/build_metal_userspace.py

      - name: Upload NativeAdrenoMetal bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeAdrenoMetal-bundle
          path: out/metal/NativeAdrenoMetal-iOS16-arm64.zip
